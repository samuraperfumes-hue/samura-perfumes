name: baixar
on:
  push:
    branches: [baixar-imagens]
    paths: ['baixar/urls.txt']
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd baixar
          n=0
          while read -r nome url; do
            [ -z "$url" ] && continue
            curl -sSL -o "$nome" "$url"
          done < urls.txt
          ls -la
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A . && git commit -m "imagens baixadas" && git push
