<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samura Perfumes - Sistema</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0c0c0c; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #1a1a1a; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(255,215,0,0.3); }
    h2 { color: #ffd700; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #ccc; }
    input, select { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
    button { background: #ffd700; color: #000; border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
    button:hover { background: #e6c200; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #444; padding: 8px; text-align: left; font-size: 14px; }
    th { background: #222; color: #ffd700; }
    .linha-subtotal { background: #2a2a2a; }
    #toast-notification { position: fixed; bottom: 20px; right: 20px; background: #4caf50; color: white; padding: 10px 20px; border-radius: 4px; display: none; z-index: 1000; }
    #toast-notification.show { display: block; }
  </style>
</head>
<body>

  <div id="toast-notification"></div>

  <!-- TELA DE LOGIN -->
  <div id="loginScreen" class="container" style="max-width: 400px; margin-top: 100px;">
    <h2>🔑 ACESSO AO SISTEMA</h2>
    <div class="form-group">
      <label>USUÁRIO</label>
      <input type="text" id="loginUsuario" placeholder="Digite seu usuário">
    </div>
    <div class="form-group">
      <label>SENHA</label>
      <input type="password" id="loginSenha" placeholder="Digite sua senha">
    </div>
    <button onclick="fazerLogin()">ENTRAR NO SISTEMA</button>
  </div>

  <!-- TELA PRINCIPAL -->
  <div id="appScreen" class="container" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px;">
      <h2 id="labelUsuarioLogado" style="margin: 0;">👤 VENDEDOR</h2>
      <button onclick="location.reload()" style="width: auto; background: #d32f2f; color: white;">Sair</button>
    </div>

    <h3>📝 NOVA VENDA</h3>
    <div class="form-group">
      <label>CLIENTE</label>
      <input type="text" id="clienteNome" placeholder="Nome do cliente" list="listaClientesCadastro" oninput="buscarTelefoneClienteAutomatico()">
      <datalist id="listaClientesCadastro"></datalist>
    </div>
    <div class="form-group">
      <label>TELEFONE / WHATSAPP</label>
      <input type="text" id="clienteTelefone" placeholder="Telefone do cliente">
    </div>
    <div class="form-group">
      <label>FORMA DE PAGAMENTO</label>
      <select id="formaPagamento">
        <option value="PIX">PIX</option>
        <option value="DINHEIRO">DINHEIRO</option>
        <option value="CARTÃO">CARTÃO</option>
      </select>
    </div>
    <div class="form-group">
      <label>DATA DE AGENDAMENTO (Opcional)</label>
      <input type="date" id="dataAgendamento">
    </div>

    <h4>Itens da Venda</h4>
    <div id="containerItens"></div>
    <button type="button" onclick="adicionarLinhaProduto()" style="background: #333; color: #ffd700; margin-bottom: 15px;">+ Adicionar Outro Produto</button>

    <div class="form-group">
      <label>DESCONTO (R$)</label>
      <input type="number" id="descontoTotal" value="0" step="0.01" oninput="calcularTotais()">
    </div>
    
    <div style="font-size: 18px; margin-bottom: 15px; color: #ffd700;">
      <b>TOTAL FINAL: R$ <span id="labelTotalFinal">0,00</span></b>
    </div>

    <button onclick="salvarVenda()" style="background: #4caf50; color: white; font-size: 16px;">FINALIZAR E SALVAR VENDA</button>

    <h3 style="margin-top: 40px;">📊 PAINEL DE CONTROLE E VENDAS</h3>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Vendedor</th>
            <th>Cliente</th>
            <th>Valor</th>
            <th>Agendamento</th>
            <th>Pagamento</th>
            <th>Entrega</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaControle">
          <tr><td colspan="8" style="text-align:center;">Carregando painel...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw9PqZASwgNfrMv-hXqssFG9vylTgxbqR7_dhBoNkiIhEFs64C8A8atE2aeso5z2Ejh/exec";
    const NOME_ADMINISTRADOR = "RODRIGO";

    let catalogoGlobal = [];
    let mapaClientesGlobal = {};
    let usuarioLogado = "";
    let cacheVendas = [];

    async function chamarAPI(acao, dados = {}) {
      try {
        const resposta = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ acao: acao, ...dados })
        });
        const texto = await resposta.text();
        return JSON.parse(texto);
      } catch (erro) {
        return { sucesso: false, erro: "Falha na conexão." };
      }
    }

    function exibirToast(mensagem) {
      var toast = document.getElementById("toast-notification");
      toast.innerText = mensagem;
      toast.className = "show";
      setTimeout(function() { toast.className = ""; }, 2500);
    }

    async function fazerLogin() {
      const u = document.getElementById('loginUsuario').value;
      const s = document.getElementById('loginSenha').value;
      if (!u || !s) return alert("Preencha usuário e senha.");

      const res = await chamarAPI("autenticarUsuario", { usuario: u, senha: s });
      if (!res || !res.sucesso) return alert("Erro no login.");

      usuarioLogado = res.usuario;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      document.getElementById('labelUsuarioLogado').innerText = "👤 VENDEDOR: " + usuarioLogado.toUpperCase();

      await buscarDadosIniciais();
      document.getElementById('containerItens').innerHTML = '';
      adicionarLinhaProduto();
      carregarPainelControle();
    }

    async function buscarDadosIniciais() {
      const res = await chamarAPI("buscarDadosIniciais");
      if (res && res.sucesso) {
        catalogoGlobal = res.catalogo || res.dadosCatalogo || [];
        mapaClientesGlobal = res.clientes || {};
        preencherDatalistClientesCadastro();
      }
    }

    function preencherDatalistClientesCadastro() {
      const datalist = document.getElementById('listaClientesCadastro');
      if (!datalist) return;
      datalist.innerHTML = '';
      Object.keys(mapaClientesGlobal).forEach(nome => {
        const opt = document.createElement('option');
        opt.value = nome;
        datalist.appendChild(opt);
      });
    }

    function buscarTelefoneClienteAutomatico() {
      const nomeInput = document.getElementById('clienteNome').value.trim().toUpperCase();
      const campoTelefone = document.getElementById('clienteTelefone');
      if (mapaClientesGlobal[nomeInput]) {
        const info = mapaClientesGlobal[nomeInput];
        campoTelefone.value = typeof info === 'object' ? (info.telefone || '') : info;
      } else {
        campoTelefone.value = '';
      }
    }

    function adicionarLinhaProduto() {
      const container = document.getElementById('containerItens');
      const div = document.createElement('div');
      div.className = 'item-linha';
      div.style.display = 'flex';
      div.style.gap = '5px';
      div.style.marginBottom = '10px';
      div.innerHTML = `
        <div style="flex:2;"><select class="sel-tipo" onchange="atualizarOpcoesFragrancia(this); calcularTotais();"><option value="">Tipo...</option></select></div>
        <div style="flex:2;"><select class="sel-frag" onchange="atualizarOpcoesVolumetria(this); calcularTotais();"><option value="">Fragrância...</option></select></div>
        <div style="flex:1;"><select class="sel-vol" onchange="atualizarPrecoEVolumetria(this); calcularTotais();"><option value="">Vol.</option></select></div>
        <div style="flex:1;"><input type="number" value="1" min="1" oninput="calcularTotais()" class="qtd"></div>
        <div style="flex:1;"><input type="number" placeholder="Unit" step="0.01" oninput="calcularTotais()" class="preco"></div>
        <button type="button" onclick="removerLinha(this)" style="width: 40px; background: #d32f2f; color: white;">X</button>
      `;
      container.appendChild(div);
      atualizarOpcoesTipo(div.querySelector('.sel-tipo'));
    }

    function atualizarOpcoesTipo(selectTipo) {
      if (!catalogoGlobal.length) return;
      const tiposUnicos = [...new Set(catalogoGlobal.map(item => item.tipo || item.Tipo || item[0]).filter(Boolean))];
      selectTipo.innerHTML = '<option value="">Tipo...</option>';
      tiposUnicos.forEach(t => selectTipo.innerHTML += `<option value="${t}">${t}</option>`);
      if (tiposUnicos.length) selectTipo.value = tiposUnicos[0];
      atualizarOpcoesFragrancia(selectTipo);
    }

    function atualizarOpcoesFragrancia(selectTipo) {
      const linha = selectTipo.closest('div').parentNode;
      const tipoSel = selectTipo.value;
      const selectFrag = linha.querySelector('.sel-frag');
      const filtrados = catalogoGlobal.filter(item => String(item.tipo || item[0]).trim() === String(tipoSel).trim());
      const frags = [...new Set(filtrados.map(item => item.fragrancia || item[1]).filter(Boolean))];
      selectFrag.innerHTML = '<option value="">Fragrância...</option>';
      frags.forEach(f => selectFrag.innerHTML += `<option value="${f}">${f}</option>`);
      atualizarOpcoesVolumetria(selectFrag);
    }

    function atualizarOpcoesVolumetria(selectFrag) {
      const linha = selectFrag.closest('div').parentNode;
      const tipoSel = linha.querySelector('.sel-tipo').value;
      const fragSel = selectFrag.value;
      const selectVol = linha.querySelector('.sel-vol');
      const opcoes = catalogoGlobal.filter(item => String(item.tipo || item[0]) === tipoSel && String(item.fragrancia || item[1]) === fragSel);
      selectVol.innerHTML = opcoes.map(o => `<option value="${o.volumetria || o[2]}" data-preco="${o.preco || o[3]}">${o.volumetria || o[2]}</option>`).join('');
      atualizarPrecoEVolumetria(selectVol);
    }

    function atualizarPrecoEVolumetria(selectVol) {
      const linha = selectVol.closest('div').parentNode;
      const opt = selectVol.options[selectVol.selectedIndex];
      if (opt) linha.querySelector('.preco').value = parseFloat(opt.getAttribute('data-preco') || 0).toFixed(2);
    }

    function removerLinha(btn) {
      btn.closest('div').parentNode.remove();
      calcularTotais();
    }

    function calcularTotais() {
      let subtotal = 0;
      document.querySelectorAll('.item-linha').forEach(l => {
        subtotal += (parseFloat(l.querySelector('.qtd').value) || 0) * (parseFloat(l.querySelector('.preco').value) || 0);
      });
      const desconto = parseFloat(document.getElementById('descontoTotal').value) || 0;
      document.getElementById('labelTotalFinal').innerText = Math.max(0, subtotal - desconto).toFixed(2).replace('.', ',');
    }

    async function salvarVenda() {
      const cliente = document.getElementById('clienteNome').value.trim();
      if(!cliente) return alert("Preencha o cliente.");
      const itens = [];
      let subtotal = 0;
      document.querySelectorAll('.item-linha').forEach(l => {
        const qtd = parseFloat(l.querySelector('.qtd').value) || 0;
        const unit = parseFloat(l.querySelector('.preco').value) || 0;
        if(l.querySelector('.sel-frag').value && qtd > 0) {
          itens.push({
            tipo: l.querySelector('.sel-tipo').value,
            fragrancia: l.querySelector('.sel-frag').value,
            volumetria: l.querySelector('.sel-vol').value,
            qtd: qtd,
            unitario: unit
          });
          subtotal += (qtd * unit);
        }
      });
      if(!itens.length) return alert("Adicione itens válidos.");
      const desconto = parseFloat(document.getElementById('descontoTotal').value) || 0;
      const res = await chamarAPI("registrarVenda", { dadosVenda: {
        vendedor: usuarioLogado, cliente: cliente,
        dataAgendamento: document.getElementById('dataAgendamento').value,
        formaPagamento: document.getElementById('formaPagamento').value,
        desconto: desconto, totalBruto: subtotal, totalLiquido: Math.max(0, subtotal - desconto), itens: itens
      }});
      if (res && res.sucesso) {
        exibirToast("✓ Venda salva!");
        document.getElementById('clienteNome').value = '';
        document.getElementById('containerItens').innerHTML = '';
        adicionarLinhaProduto();
        carregarPainelControle();
      } else { alert("Erro ao salvar."); }
    }

    async function carregarPainelControle() {
      const res = await chamarAPI("buscarPainelControle");
      if (res && res.sucesso) {
        cacheVendas = res.dados || [];
        renderizarTabelaControle(cacheVendas);
      }
    }

    function renderizarTabelaControle(vendasExibidas) {
      const tbody = document.getElementById('tabelaControle');
      if (!vendasExibidas.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Nenhuma venda.</td></tr>';
        return;
      }
      const total = vendasExibidas.reduce((acc, v) => acc + (parseFloat(v.totalLiquido || v.valorLiquido) || 0), 0);
      let html = `<tr class="linha-subtotal"><td colspan="3"><b>SUBTOTAL:</b></td><td><b>R$ ${total.toFixed(2).replace('.', ',')}</b></td><td colspan="4">Comissão: R$ ${(total*0.2).toFixed(2).replace('.', ',')}</td></tr>`;
      html += vendasExibidas.map(v => `
        <tr>
          <td><b>${v.id}</b></td>
          <td>${v.vendedor || '-'}</td>
          <td>${v.cliente || '-'}</td>
          <td>R$ ${(parseFloat(v.totalLiquido || v.valorLiquido) || 0).toFixed(2).replace('.', ',')}</td>
          <td>${v.dataAgendamento || '-'}</td>
          <td><select onchange="mudarStatus(${v.linha}, 'pagamento', this.value)"><option value="Pago" ${v.statusPagamento=='Pago'?'selected':''}>Pago</option><option value="Pendente" ${v.statusPagamento=='Pendente'?'selected':''}>Pendente</option></select></td>
          <td><select onchange="mudarStatus(${v.linha}, 'entrega', this.value)"><option value="Entregue" ${v.statusEntrega=='Entregue'?'selected':''}>Entregue</option><option value="Pendente" ${v.statusEntrega=='Pendente'?'selected':''}>Pendente</option></select></td>
          <td>-</td>
        </tr>
      `).join('');
      tbody.innerHTML = html;
    }

    async function mudarStatus(linha, tipo, valor) {
      await chamarAPI("atualizarStatusVenda", { linha: linha, tipo: tipo, valor: valor });
      exibirToast("Atualizado!");
    }
  </script>
</body>
</html>
